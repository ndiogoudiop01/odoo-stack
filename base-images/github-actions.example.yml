# ---------------------------------------------------------------------------
#  Construction automatique des images de base Odoo.
#
#  À copier dans ce dépôt sous  .github/workflows/base-images.yml
#
#  Prérequis (Settings → Secrets and variables → Actions) :
#    Secret  ODOO_SOURCES_TOKEN  = PAT fine-grained, « Contents: Read »
#                                  sur <owner>/odoo ET <owner>/enterprise
#    (GITHUB_TOKEN suffit pour pousser sur ghcr.io du même compte)
#
#  Déclencheurs : manuel, ou tous les lundis à 3h UTC pour récupérer les
#  correctifs poussés sur vos branches de version.
# ---------------------------------------------------------------------------
name: Images de base Odoo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version Odoo (17.0, 18.0, 19.0)"
        required: true
        default: "19.0"
      edition:
        description: "Édition"
        required: true
        default: "enterprise"
        type: choice
        options: [enterprise, community]
  schedule:
    - cron: "0 3 * * 1"

env:
  REGISTRY: ghcr.io
  GITHUB_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ github.event_name == 'schedule' && fromJSON('["17.0","18.0","19.0"]') || fromJSON(format('["{0}"]', inputs.version)) }}
        edition: ${{ github.event_name == 'schedule' && fromJSON('["enterprise"]') || fromJSON(format('["{0}"]', inputs.edition)) }}

    steps:
      - uses: actions/checkout@v4

      - name: Version de Python selon la version d'Odoo
        id: py
        run: |
          case "${{ matrix.version }}" in
            16.0) echo "python=3.10" >> "$GITHUB_OUTPUT" ;;
            17.0) echo "python=3.11" >> "$GITHUB_OUTPUT" ;;
            *)    echo "python=3.12" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./base-images
          file: ./base-images/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/odoo:${{ matrix.version }}-${{ matrix.edition }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/odoo:${{ matrix.version }}-${{ matrix.edition }}-${{ github.run_number }}
          build-args: |
            GITHUB_OWNER=${{ github.repository_owner }}
            ODOO_REPO=odoo
            ENTERPRISE_REPO=enterprise
            ODOO_VERSION=${{ matrix.version }}
            EDITION=${{ matrix.edition }}
            PYTHON_VERSION=${{ steps.py.outputs.python }}
          secrets: |
            gh_token=${{ secrets.ODOO_SOURCES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
