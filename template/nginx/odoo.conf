###############################################################################
#  Reverse-proxy interne du client.
#
#  Pourquoi ? Odoo écoute sur DEUX ports :
#     8069 -> HTTP classique
#     8072 -> websocket / longpolling (obligatoire dès que workers > 0)
#  Traefik (Coolify) ne route qu'un seul port par domaine : ce nginx fait
#  l'aiguillage, gère le gzip, le cache des assets et la taille des uploads.
#
#  C'est le SEUL service exposé publiquement. Odoo et PostgreSQL restent
#  sur le réseau interne du projet.
###############################################################################

upstream odoo      { server odoo:8069; }
upstream odoochat  { server odoo:8072; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Traefik/Coolify termine le TLS : on relaie le protocole d'origine à Odoo.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    # --- Limites ------------------------------------------------------------
    client_max_body_size 512M;      # pièces jointes, imports, factures scannées
    client_body_buffer_size 128k;
    proxy_read_timeout  900s;
    proxy_connect_timeout 300s;
    proxy_send_timeout  900s;
    send_timeout        900s;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1100;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/xml application/json
               application/javascript application/x-javascript
               image/svg+xml application/wasm;

    # --- En-têtes de sécurité ----------------------------------------------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"      always;

    # --- En-têtes proxy communs --------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_redirect off;

    # --- Websocket / longpolling -------------------------------------------
    location /websocket {
        proxy_pass http://odoochat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /longpolling {          # compatibilité Odoo <= 15
        proxy_pass http://odoochat;
    }

    # --- Assets statiques : cache navigateur --------------------------------
    location ~* /web/static/ {
        proxy_pass http://odoo;
        proxy_cache_valid 200 302 60m;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Sonde de santé (utilisée par Coolify / uptime monitoring) ----------
    location = /_health {
        access_log off;
        proxy_pass http://odoo/web/health;
    }

    # --- Tout le reste ------------------------------------------------------
    location / {
        proxy_pass http://odoo;
    }
}
